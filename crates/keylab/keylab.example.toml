# keylab refuses privacy floors below 25 and 2000, respectively.
# When an input remapper (evsieve, interception-tools, kanata, or keyd) grabs the physical
# keyboard, that device delivers no events here; capture the remapper's virtual output instead.
# "Glove80" is correct only when no remapper is in the input path.
device_name_contains = "Evsieve Virtual Device"
db_path = "~/.local/share/glove80-lab/keylab.db"
keymap_meta_path = "/home/sascha/src/glove80-zmk/out/keymap-meta.json"
bucket_seconds = 10
tier_a_seal_floor = 25
tier_b_seal_count = 2000
live_snapshot_seconds = 1
# The first entry must be "default". At most 8, names limited to [a-z0-9-].
# The cap keeps the per-profile Tier B accumulators bounded.
profiles = ["default", "training-de", "training-en", "gaming"]
# Revert to "default" after this many seconds with no keystrokes on any device.
# Set to 0 to disable the idle auto-revert entirely.
auto_revert_idle_seconds = 900

# Multi-device capture. Each rule pairs an evdev name fragment with the position space that
# keyboard's Tier B counts belong to. Fragments must be unambiguous — no fragment may contain
# another. Omit this table entirely to keep the single-keyboard `device_name_contains` above.
# [[devices]]
# name = "glove80"
# name_contains = "Evsieve Virtual Device"
# keymap_meta_path = "/home/sascha/src/glove80-zmk/out/keymap-meta.json"
#
# [[devices]]
# name = "qwerty-ansi"
# name_contains = "AT Translated Set 2 keyboard"
# keymap_meta_path = "/home/sascha/src/glove80-zmk/config/qwerty-ansi-meta.json"
